name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Normalize Obsidian links
        run: |
          python3 - <<'PY'
          import re, glob
          fixed = 0
          for f in glob.glob('content/**/*.md', recursive=True):
              s = open(f, encoding='utf-8').read()
              orig = s
              s = re.sub(r'\[\[Archiv/[^\]]*?/([^/\]|]+)\|([^\]]+)\]\]', r'[[\1|\2]]', s)
              s = re.sub(r'\[\[(?:Rollenspiel/)?Eridune/([^\]]+)\]\]', r'[[\1]]', s)
              s = re.sub(r'\[\[Rollenspiel/([^\]]+)\]\]', r'[[\1]]', s)
              if s != orig:
                  open(f, 'w', encoding='utf-8').write(s)
                  fixed += 1
          print(f"Normalized links in {fixed} files")
          PY
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
