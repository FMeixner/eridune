# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Eridune
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: de-DE
  baseUrl: fmeixner.github.io/eridune
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: IM Fell English SC
      body: Crimson Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#73732e"
        tertiary: "#9a9a55"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#cfc8bc"
        dark: "#e8e0d0"
        secondary: "#c8c477"
        tertiary: "#8a8a4d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: its-theme
      mode: both
      styleSettings:
        "ITS@@--accent@@dark": "#c8c477"
        "ITS@@--accent-color@@dark": "200, 196, 119"
        "ITS@@--accent-h@@dark": "57"
        "ITS@@--accent-s@@dark": "43%"
        "ITS@@--accent-l@@dark": "62%"
        "ITS@@--accent2@@dark": "#b3a45c"
        "ITS@@--accent2-lite@@dark": "#c8c477"
        "ITS@@--lite-accent@@dark": "#d6d08a"
        "ITS@@--dark-accent@@dark": "#3f3b21"
        "ITS@@--deep-dark-accent@@dark": "#2e2b17"
        "ITS@@--headers@@dark": "#d4c66a"
        "ITS@@--embed-h@@dark": "#cdc06a"
        "ITS@@--h2-color@@dark": "#cdc06a"
        "ITS@@--code-text@@dark": "#b8b45f"
        "ITS@@--folder-open@@dark": "#9a8a4b"
        "ITS@@--bg@@dark": "#26241c"
        "ITS@@--outer-bar@@dark": "#131109"
        "ITS@@--code-bg@@dark": "#232015"
        "ITS@@--text@@dark": "#d8d2c0"
        "ITS@@--accent@@light": "#6e6c2c"
        "ITS@@--accent-color@@light": "110, 108, 44"
        "ITS@@--accent-h@@light": "57"
        "ITS@@--accent-s@@light": "43%"
        "ITS@@--accent-l@@light": "30%"
        "ITS@@--accent2@@light": "#7d7434"
        "ITS@@--accent2-lite@@light": "#5f5d28"
        "ITS@@--lite-accent@@light": "#4f4d20"
        "ITS@@--dark-accent@@light": "#c9c39a"
        "ITS@@--headers@@light": "#6e6c2c"
        "ITS@@--embed-h@@light": "#6e6c2c"
        "ITS@@--h2-color@@light": "#6e6c2c"
        "ITS@@--code-text@@light": "#6b672e"
        "ITS@@--folder-open@@light": "#8a7a3c"
        "ITS@@--h1-font": "'IM Fell English SC', serif"
        "ITS@@--h2-font": "'IM Fell English SC', serif"
        "ITS@@--h3-font": "'IM Fell English SC', serif"
        "ITS@@--h4-font": "'IM Fell English SC', serif"
        "ITS@@--h5-font": "'IM Fell English SC', serif"
        "ITS@@--h6-font": "'IM Fell English SC', serif"
        "ITS@@--font-text-theme": "'Crimson Pro', serif"
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:Requiae/quartz-leaflet-bases-plugin
    enabled: true
    options:
      enableCopyTool: false
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
